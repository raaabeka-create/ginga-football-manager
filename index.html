<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ghana Football Manager</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>Ghana Football Manager</h1>
    <p>Manager Dashboard</p>
</header>

<div class="container">

    <aside class="sidebar">
        <h3>MENU</h3>

        <button>Dashboard</button>
        <button>Squad</button>
        <button>Tactics</button>
        <button>Transfers</button>
        <button>Fixtures</button>
        <button>League Table</button>
        <button>Finances</button>
    </aside>

    <main class="main">

        <div class="card">
            <h2>Welcome, Manager</h2>
            <p>Your football journey begins here.</p>
            <p><strong>Club:</strong> Accra Lions FC</p>
            <p><strong>League:</strong> Ghana Premier Division</p>
        </div>

        <div class="stats">

            <div class="stat">
                <p>League Position</p>
                <h2>1st</h2>
            </div>

            <div class="stat">
                <p>Points</p>
                <h2>0</h2>
            </div>

            <div class="stat">
                <p>Balance</p>
                <h2>GH₵ 500,000</h2>
            </div>

        </div>

        <div class="card">
            <h2>Next Match</h2>
            <p>Accra Lions FC vs Kumasi Warriors</p>
            <p>Saturday — 15:00</p>
        </div>

    </main>

</div>

</body>
</html>
