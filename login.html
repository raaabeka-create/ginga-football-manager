
<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#d4a017">
    <title>Ginga FM | Manager Account</title>

    <script>
        try {
            const theme = localStorage.getItem("ginga-fm-theme");
            document.documentElement.dataset.theme =
                theme === "dark" ? "dark" : "light";
        } catch (error) {
            document.documentElement.dataset.theme = "light";
        }
    </script>

    <link rel="stylesheet" href="./style.css">

    <style>
        body {
            min-height: 100vh;
        }

        .account-page {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px 16px;
        }

        .account-card {
            width: 100%;
            max-width: 460px;
            padding: 32px;
            border: 1px solid var(--border);
            border-radius: 16px;
            background: var(--surface);
            color: var(--text);
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.18);
        }

        .account-brand {
            margin-bottom: 26px;
            text-align: center;
        }

        .account-brand h1 {
            margin: 0;
            color: var(--accent-hover);
            font-family: "Matcha Mint", Georgia, serif;
            font-size: 42px;
            font-weight: 400;
        }

        .account-brand p {
            margin: 8px 0 0;
            color: var(--muted);
            font-size: 14px;
        }

        .account-card h2 {
            margin: 0 0 8px;
            font-size: 25px;
        }

        .account-description {
            margin: 0 0 24px;
            color: var(--muted);
            font-size: 14px;
            line-height: 1.6;
        }

        .account-tabs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 22px;
        }

        .account-tab {
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--surface-secondary);
            color: var(--text);
            cursor: pointer;
        }

        .account-tab.active {
            border-color: var(--accent-border);
            background: var(--accent);
            color: var(--accent-contrast);
            font-weight: bold;
        }

        .account-field {
            margin-bottom: 17px;
        }

        .account-field label {
            display: block;
            margin-bottom: 7px;
            font-size: 13px;
            font-weight: bold;
        }

        .account-field input {
            width: 100%;
            min-height: 46px;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--surface-secondary);
            color: var(--text);
            font: inherit;
        }

        .account-field input:focus {
            outline: 2px solid var(--focus);
            outline-offset: 1px;
        }

        .account-submit {
            width: 100%;
            min-height: 48px;
            margin-top: 4px;
            padding: 12px;
            border: 0;
            border-radius: 8px;
            background: var(--accent);
            color: var(--accent-contrast);
            font-weight: bold;
            cursor: pointer;
        }

        .account-submit:hover {
            filter: brightness(0.94);
        }

        .account-submit:disabled {
            cursor: wait;
            opacity: 0.65;
        }

        .account-message {
            display: none;
            margin-top: 18px;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 13px;
            line-height: 1.6;
            overflow-wrap: anywhere;
        }

        .account-message.visible {
            display: block;
        }

        .account-message.error {
            border-color: #d34b4b;
        }

        .account-message.success {
            border-color: #29965b;
        }

        .account-footer {
            margin-top: 22px;
            text-align: center;
            color: var(--muted);
            font-size: 12px;
            line-height: 1.6;
        }

        .account-link {
            display: inline-block;
            margin-top: 16px;
            color: var(--accent-hover);
            font-size: 13px;
            text-decoration: none;
        }

        .account-link:hover {
            text-decoration: underline;
        }

        @media (max-width: 480px) {
            .account-card {
                padding: 24px 19px;
            }

            .account-brand h1 {
                font-size: 36px;
            }
        }
    </style>
</head>

<body>
    <main class="account-page">
        <section class="account-card">
            <header class="account-brand">
                <h1>GINGA FM</h1>
                <p>Ghana Football Management Simulation</p>
            </header>

            <h2 id="formTitle">Welcome, Manager</h2>
            <p class="account-description" id="formDescription">
                Create your account to begin your managerial journey.
            </p>

            <div class="account-tabs">
                <button
                    type="button"
                    class="account-tab active"
                    id="registerTab"
                    aria-pressed="true">
                    Create account
                </button>

                <button
                    type="button"
                    class="account-tab"
                    id="loginTab"
                    aria-pressed="false">
                    Log in
                </button>
            </div>

            <form id="accountForm">
                <div class="account-field">
                    <label for="email">Email address</label>
                    <input
                        id="email"
                        name="email"
                        type="email"
                        autocomplete="email"
                        placeholder="you@example.com"
                        required>
                </div>

                <div class="account-field">
                    <label for="password">Password</label>
                    <input
                        id="password"
                        name="password"
                        type="password"
                        autocomplete="new-password"
                        minlength="8"
                        placeholder="At least 8 characters"
                        required>
                </div>

                <div class="account-field" id="confirmPasswordField">
                    <label for="confirmPassword">Confirm password</label>
                    <input
                        id="confirmPassword"
                        name="confirmPassword"
                        type="password"
                        autocomplete="new-password"
                        minlength="8"
                        placeholder="Enter your password again"
                        required>
                </div>

                <button class="account-submit" id="submitButton" type="submit">
                    Create my account
                </button>
            </form>

            <div
                class="account-message"
                id="accountMessage"
                role="status"
                aria-live="polite">
            </div>

            <a class="account-link" id="forgotPasswordLink" href="#">
                Forgot your password?
            </a>

            <div class="account-footer">
                Your manager profile and club career are saved to your account.
            </div>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./supabaseClient.js"></script>

    <script>
    (function () {
        "use strict";

        const form = document.getElementById("accountForm");
        const registerTab = document.getElementById("registerTab");
        const loginTab = document.getElementById("loginTab");
        const confirmField = document.getElementById("confirmPasswordField");
        const confirmPassword = document.getElementById("confirmPassword");
        const password = document.getElementById("password");
        const email = document.getElementById("email");
        const submitButton = document.getElementById("submitButton");
        const message = document.getElementById("accountMessage");
        const formTitle = document.getElementById("formTitle");
        const formDescription = document.getElementById("formDescription");
        const forgotPasswordLink = document.getElementById("forgotPasswordLink");

        let mode = "register";

        function showMessage(text, type) {
            message.textContent = text;
            message.className = "account-message visible " + type;
        }

        function clearMessage() {
            message.textContent = "";
            message.className = "account-message";
        }

        function setMode(nextMode) {
            mode = nextMode;
            clearMessage();

            const registering = mode === "register";

            registerTab.classList.toggle("active", registering);
            loginTab.classList.toggle("active", !registering);

            registerTab.setAttribute("aria-pressed", String(registering));
            loginTab.setAttribute("aria-pressed", String(!registering));

            confirmField.hidden = !registering;
            confirmPassword.required = registering;
            password.autocomplete = registering
                ? "new-password"
                : "current-password";

            formTitle.textContent = registering
                ? "Welcome, Manager"
                : "Welcome back";

            formDescription.textContent = registering
                ? "Create your account to begin your managerial journey."
                : "Log in to continue your Ginga FM journey.";

            submitButton.textContent = registering
                ? "Create my account"
                : "Log in";

            forgotPasswordLink.style.display = registering
                ? "none"
                : "inline-block";
        }

        registerTab.addEventListener("click", function () {
            setMode("register");
        });

        loginTab.addEventListener("click", function () {
            setMode("login");
        });

        form.addEventListener("submit", async function (event) {
            event.preventDefault();
            clearMessage();

            const emailValue = email.value.trim();
            const passwordValue = password.value;

            if (mode === "register" &&
                passwordValue !== confirmPassword.value) {
                showMessage("Your passwords do not match.", "error");
                return;
            }

            submitButton.disabled = true;
            submitButton.textContent = "Please wait...";

            try {
                if (mode === "register") {
                    const { data, error } = await supabaseClient.auth.signUp({
                        email: emailValue,
                        password: passwordValue,
                        options: {
                            emailRedirectTo: window.location.href.split("?")[0]
                        }
                    });

                    if (error) throw error;

                    if (data.session) {
                        showMessage("Account created. Opening manager setup...", "success");
                        window.location.replace("./manager.html");
                        return;
                    } else {
                        showMessage(
                            "Account created. Check your email and click the " +
                            "confirmation link before logging in. If you do not " +
                            "see the email, check your spam folder.",
                            "success"
                        );
                    }
                } else {
                    const { data: loginData, error } =
                        await supabaseClient.auth.signInWithPassword({
                            email: emailValue,
                            password: passwordValue
                        });

                    if (error) throw error;

                    const metadata = loginData.user && loginData.user.user_metadata ? loginData.user.user_metadata : {};
                    const destination = !metadata.manager_name ? "manager.html" : (!metadata.club_id ? "club-selection.html" : "index.html");
                    showMessage("Login successful! Opening your career...", "success");
                    window.location.replace("./" + destination);
                    return;
                }
            } catch (error) {
                console.error("Ginga FM account error:", error);
                showMessage(
                    error.message || "Something went wrong. Please try again.",
                    "error"
                );
            } finally {
                submitButton.disabled = false;
                submitButton.textContent = mode === "register"
                    ? "Create my account"
                    : "Log in";
            }
        });

        forgotPasswordLink.addEventListener("click", async function (event) {
            event.preventDefault();
            clearMessage();

            const emailValue = email.value.trim();

            if (!emailValue) {
                showMessage(
                    "Enter your email address first, then click Forgot your password.",
                    "error"
                );
                email.focus();
                return;
            }

            forgotPasswordLink.textContent = "Sending...";

            try {
                const { error } =
                    await supabaseClient.auth.resetPasswordForEmail(emailValue, {
                        redirectTo: window.location.href.split("?")[0]
                    });

                if (error) throw error;

                showMessage(
                    "If an account exists for this email, a password reset link will be sent. Check your inbox and spam folder.",
                    "success"
                );
            } catch (error) {
                showMessage(error.message, "error");
            } finally {
                forgotPasswordLink.textContent = "Forgot your password?";
            }
        });

        async function checkExistingSession() {
            try {
                const { data, error } = await supabaseClient.auth.getSession();

                if (error) throw error;

                if (data.session) {
                    const metadata = data.session.user && data.session.user.user_metadata ? data.session.user.user_metadata : {};
                    const destination = !metadata.manager_name ? "manager.html" : (!metadata.club_id ? "club-selection.html" : "index.html");
                    window.location.replace("./" + destination);
                    return;

                    const signOutButton = document.createElement("button");
                    signOutButton.type = "button";
                    signOutButton.className = "account-submit";
                    signOutButton.style.marginTop = "12px";
                    signOutButton.textContent = "Log out";
                    signOutButton.addEventListener("click", async function () {
                        signOutButton.disabled = true;

                        const { error: signOutError } =
                            await supabaseClient.auth.signOut();

                        if (signOutError) {
                            showMessage(signOutError.message, "error");
                            signOutButton.disabled = false;
                            return;
                        }

                        signOutButton.remove();
                        showMessage("You have logged out.", "success");
                    });

                    message.insertAdjacentElement("afterend", signOutButton);
                }
            } catch (error) {
                console.error("Could not check account session:", error);
            }
        }

        setMode("register");
        checkExistingSession();
    })();
    </script>
</body>
</html>
